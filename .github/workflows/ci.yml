name: CI

# Render watches these checks: a push to main is deployed only when this workflow passes
# (render.yaml sets autoDeployTrigger: checksPass).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Front end first: its build writes src/RushDay.Api/wwwroot, which the .NET integration tests serve.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/RushDay.Web/package-lock.json

      - name: Front-end install
        run: npm ci
        working-directory: src/RushDay.Web

      - name: Front-end lint
        run: npm run lint
        working-directory: src/RushDay.Web

      - name: Front-end typecheck
        run: npm run typecheck
        working-directory: src/RushDay.Web

      - name: Front-end tests
        run: npm test
        working-directory: src/RushDay.Web

      - name: Front-end build
        run: npm run build
        working-directory: src/RushDay.Web

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/RushDay.UnitTests --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Integration tests (Testcontainers)
        run: dotnet test tests/RushDay.IntegrationTests --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Docker image builds
        run: docker build --tag rushday-api:ci .

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
