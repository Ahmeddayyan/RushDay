name: CI

# Render watches these checks: a push to main is deployed only when this workflow passes
# (render.yaml sets autoDeployTrigger: checksPass).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/RushDay.UnitTests --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Integration tests (Testcontainers)
        run: dotnet test tests/RushDay.IntegrationTests --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Docker image builds
        run: docker build --tag rushday-api:ci .

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
